
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노션 활용 과제</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
            margin: 0;
            padding: 80px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 50px 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            color: #222;
            margin-bottom: 15px;
        }

        .intro {
            color: #777;
            margin-bottom: 35px;
        }

        .link-box {
            display: block;
            padding: 20px;
            margin: 18px 0;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            transition: 0.3s;
        }

        .link-box:hover {
            background-color: #f3f6ff;
            border-color: #b8caff;
        }

        .link-box h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .link-box p {
            font-size: 14px;
            color: #777;
            margin: 0;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>노션 활용 과제</h1>
        <p class="intro">노션 활용 과제 제출 페이지입니다.</p>

        <a href="PDF파일주소" target="_blank" class="link-box">
            <h2>PDF 과제 확인하기</h2>
            <p>과제 결과물 PDF</p>
        </a>

        <a href="노션링크" target="_blank" class="link-box">
            <h2>노션 페이지 확인하기</h2>
            <p>실제 노션 활용 페이지</p>
        </a>

        <footer>Notion Assignment</footer>
    </div>

</body>
</html>
